<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Jojokenpo</title>
</head>
<body>

    <div class="backgroundImg"></div>

    <div class="container">
        <h1>Jajanken-Po</h1>

        <div class="buttons">
            <button id="rock" onclick="playHuman('rock')">&#x1F44A</button>
            <button id="paper" onclick="playHuman('paper')">&#x270B</button>
            <button id="scissor" onclick="playHuman('scissor')">✌️</button>
        </div>

        <p class="result"></p>
        <p class="yourScore">Você: <span id="humanScore">0</span></p>
        <p>X</p>
        <p class="machineScore">Gon Freecs: <span id="machineScore">0</span></p>
    </div>

    <script src="./script.js"></script>
</body>
</html>
